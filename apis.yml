aid: juno
name: Juno
description: >-
  Juno (juno.co), operated by Juno Technology, Inc., is a San Francisco-based owner's representation,
  development-consulting and construction-management firm for prefabricated, modular and mass-timber
  multifamily development, working with developers from site feasibility and entitlement through
  delivery across North America. Juno owns the rights to the Juno Mass Timber System, a field-tested
  kit-of-parts building system of roughly 33 components configurable into 25+ unit types, proven on
  the 24-unit Juno East Austin project at 400 Comal St, Austin TX. The current company is the 2024
  relaunch ("Juno 2.0") of the venture-funded Juno / Juno Residential founded in 2019 by Jonathan
  Scherr, BJ Siegel and Chester Chipperfield, which raised roughly $32M from Comcast Ventures, Khosla
  Ventures and RET Ventures before running out of money; the relaunched firm is led by co-founders
  Emily Mills Marineau and Jen Canchola. Juno sells professional services and a physical building
  system, not software: as of this enrichment pass it publishes a marketing site, a mass-timber
  system page, a contact form, a newsletter signup, terms of service and a privacy policy, and no
  public API, developer portal, OpenAPI specification, SDK, or machine-readable contract of any kind.
